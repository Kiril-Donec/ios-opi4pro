name: A733 XNU

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [opi4pro]
    paths:
      - "xnu/patches/**"
      - "a733/xnu-a733-firstboot.patch"
      - "a733/xnu-a733-portrait.patch"
      - "a733/xnu-a733-first-exception.patch"
      - "a733/xnu-a733-neon-isb.patch"
      - "a733/xnu-a733-serror-diag.patch"
      - "a733/xnu-a733-fbcon-portrait.patch"
      - "a733/xnu-a733-boot-trace.patch"
      - "a733/xnu-a733-pid1-trace.patch"
      - "a733/xnu-a733-pid1-v14-trace.patch"
      - "a733/xnu-a733-pid1-v15-open.patch"
      - "a733/xnu-a733-pid1-v16-copyinstr.patch"
      - "a733/xnu-a733-pid1-v17-usercopy.patch"
      - "a733/xnu-a733-ios-framebuffer.patch"
      - "a733/xnu-a733-sdmmc.patch"
      - "a733/xnu-a733-console-graphics.patch"
      - "a733/xnu-a733-smp-a76.patch"
      - "a733/xnu-a733-usbtouch.patch"
      - "a733/xnu-a733-cores-fb-power.patch"
      - "a733/xnu-a733-cpufreq-setup.patch"
      - "a733/xnu-a733-keychain.patch"
      - "a733/xnu-a733-iokit-report.patch"
      - "a733/xnu-a733-sched-bigpref.patch"
      - "a733/xnu-a733-no-iokitd.patch"
      - "a733/tests/test_no_iokitd_patch.py"
      - "a733/tests/test_sched_bigpref_patch.py"
      - "a733/tests/test_sched_bigpref.c"
      - "a733/tests/test_iokit_report_patch.py"
      - "a733/tests/test_keychain_patch.py"
      - "a733/tests/test_aks_wrap.cpp"
      - "a733/tests/test_cpufreq_setup_patch.py"
      - "a733/tests/test_power_logic_r.c"
      - "a733/tests/firstboot_kernel_stubs.h"
      - "a733/tests/test_cores_fb_power_patch.py"
      - "a733/tests/test_power_logic.c"
      - "a733/tests/test_fb_scaler.cpp"
      - "a733/tests/power_kernel_stubs.h"
      - "a733/tests/test_usbtouch_patch.py"
      - "a733/tests/test_usbtouch_logic.c"
      - "a733/tests/usbtouch_kernel_stubs.h"
      - "a733/tests/test_smp_a76_patch.py"
      - "a733/tests/test_console_graphics_patch.py"
      - "a733/tests/test_fbcon_logic.c"
      - "a733/tests/test_sdmmc_patch.py"
      - "a733/tests/test_sdmmc_logic.c"
      - "a733/tests/sdmmc_kernel_stubs.h"
      - "a733/tests/test_sdlog_tool.py"
      - "a733/tools/a733_sdlog.py"
      - "a733/tools/a733_sdcard_layout.py"
      - "a733/tests/test_sdcard_layout.py"
      - "a733/tests/test_ios_display.py"
      - "a733/tools/adapt_xnu_a733.py"
      - "a733/tests/test_adapt_xnu.py"
      - "a733/tools/audit_a733_macho.py"
      - "a733/tools/package_xnu_a733.py"
      - "a733/tools/make_test_ramdisk.sh"
      - "a733/tools/make_pid1_ramdisk.sh"
      - "a733/tools/make_pid1_ramdisk_macos.sh"
      - "a733/src/a733-init.S"
      - "a733/src/a733-init-v18.S"
      - "a733/src/a733-init-v19.S"
      - "tools/mkinit.py"
      - "a733/tests/test_ramdisk_pack.py"
      - "a733/src/xnu_payload.c"
      - "a733/Makefile"
      - "a733/tools/mkadt_a733.py"
      - "a733/tools/sd-boot-xnu-experimental.cmd"
      - "a733/tests/test_xnu_script.py"
      - "a733/TEST-XNU-RU.md"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          cp a733/xnu-a733-firstboot.patch dxb/patches/9999-a733-firstboot.patch
          cp a733/xnu-a733-portrait.patch dxb/patches/9999b-a733-portrait.patch
          cp a733/xnu-a733-first-exception.patch dxb/patches/9999c-a733-first-exception.patch
          cp a733/xnu-a733-neon-isb.patch dxb/patches/9999d-a733-neon-isb.patch
          cp a733/xnu-a733-serror-diag.patch dxb/patches/9999e-a733-serror-diag.patch
          cp a733/xnu-a733-fbcon-portrait.patch dxb/patches/9999f-a733-fbcon-portrait.patch
          cp a733/xnu-a733-boot-trace.patch dxb/patches/9999g-a733-boot-trace.patch
          cp a733/xnu-a733-pid1-trace.patch dxb/patches/9999h-a733-pid1-trace.patch
          cp a733/xnu-a733-pid1-v15-open.patch dxb/patches/9999i-a733-pid1-v15-open.patch
          cp a733/xnu-a733-pid1-v16-copyinstr.patch dxb/patches/9999j-a733-pid1-v16-copyinstr.patch
          cp a733/xnu-a733-pid1-v17-usercopy.patch dxb/patches/9999k-a733-pid1-v17-usercopy.patch
          # CPU scanout for real iOS IOSurface frames, no Qualcomm MDP accesses on A733.
          cp a733/xnu-a733-ios-framebuffer.patch dxb/patches/9999l-a733-ios-framebuffer.patch
          # Read-only PIO microSD (SMHC0) root device, rd=sdroot0.
          cp a733/xnu-a733-sdmmc.patch dxb/patches/9999m-a733-sdmmc.patch
          # Console scrolls; after the first iOS frame only a log band over the frame.
          cp a733/xnu-a733-console-graphics.patch dxb/patches/9999n-a733-console-graphics.patch
          # SweetCPU accepts the second Cortex-A76 (MPIDR 0x700) for cpus=2.
          cp a733/xnu-a733-smp-a76.patch dxb/patches/9999o-a733-smp-a76.patch
          # Polled USB1 OHCI driver for the HDMI display's touch screen (needs 9999m).
          cp a733/xnu-a733-usbtouch.patch dxb/patches/9999p-a733-usbtouch.patch
          # Six Cortex-A55s, row-order 30 Hz scaler, power button + PSCI power-off (needs 9999n-p).
          cp a733/xnu-a733-cores-fb-power.patch dxb/patches/9999q-a733-cores-fb-power.patch
          # Vendor cpufreq ported (efuse bin, AXP8191 rails, CPU PLLs, THS), triple press,
          # one-time Setup-skip preferences, 20 Hz (needs 9999q).
          cp a733/xnu-a733-cpufreq-setup.patch dxb/patches/9999r-a733-cpufreq-setup.patch
          # AppleKeyStore key wrap/unwrap (selectors 10/11) for securityd's keychain.
          cp a733/xnu-a733-keychain.patch dxb/patches/9999s-a733-keychain.patch
          # Report of busy IOKit services (About hang waits for IOKit to quiesce).
          cp a733/xnu-a733-iokit-report.patch dxb/patches/9999t-a733-iokit-report.patch
          # Scheduler: interactive threads to an idle A76 first, background to an A55.
          cp a733/xnu-a733-sched-bigpref.patch dxb/patches/9999u-a733-sched-bigpref.patch
          # No kernelmanagerd on iOS: do not hold the IOKit root busy for it.
          cp a733/xnu-a733-no-iokitd.patch dxb/patches/9999v-a733-no-iokitd.patch
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # topaz: Cortex-A53/A73 (ARMv8.0), so the same -mcpu as the kernel
          # (clang's apple-m1 default emits LSE atomics and LDAPR)
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed -mcpu=cortex-a53"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          # Capture the entire build log so compiler errors remain available
          # even when GitHub's public web log viewer refuses access.
          set -o pipefail
          bash build.sh 2>&1 | tee "${GITHUB_WORKSPACE}/xnu-build.log"
          ccache -s

      - name: Save concise failure diagnostics
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('xnu-build.log')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else []
          matches = [i for i, line in enumerate(lines)
                     if re.search(r'error:|fatal error|patch failed|make\[\d+\]: \*\*\*|No rule to make target', line, re.I)
                     and 'compile-time assertion failed' not in line]
          selected = set(range(max(0, len(lines) - 35), len(lines)))
          for i in matches[:50] + matches[-50:]:
              selected.update(range(max(0, i - 2), min(len(lines), i + 4)))
          report = '\n'.join(f'{i + 1}: {lines[i]}' for i in sorted(selected))
          Path('xnu-build-errors.txt').write_text(report + '\n')
          print('Compiler error matches:', len(matches))
          print(report[-12000:])
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xnu-build-errors
          path: xnu-build-errors.txt
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xnu-build-full-log
          path: xnu-build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Audit compiled A733 kernel
        run: |
          test -s out/kernel.development.sweet
          python3 a733/tools/audit_a733_macho.py out/kernel.development.sweet
          # Fail closed: dxb silently skips failed optional patches and can
          # report a green kernel build containing the OLD Qualcomm driver.
          python3 - <<'PY'
          from pathlib import Path
          kernel = Path("out/kernel.development.sweet").read_bytes()
          marker = b"A733 FB: AppleCLCD IOSurface HDMI CPU path READY"
          if marker not in kernel:
              raise SystemExit("FAIL: A733 AppleCLCD overlay was SKIPPED; refusing to package graphics kernel")
          print("PASS: A733 AppleCLCD CPU-scanout marker found in compiled XNU Mach-O")
          sd = b"A733 SD: sdroot0 ready, read-only PIO"
          if sd not in kernel:
              raise SystemExit("FAIL: A733 microSD overlay was SKIPPED; refusing to package rd=sdroot0 kernel")
          print("PASS: A733 SMHC0 microSD driver marker found in compiled XNU Mach-O")
          if b"A733 SD: sdroot0 ready, READ-WRITE PIO (sdrw=1)" not in kernel:
              raise SystemExit("FAIL: microSD root write support (sdrw=1) missing from the compiled kernel")
          if b"A733 LOG: console saved to A733LOG.TXT" not in kernel:
              raise SystemExit("FAIL: microSD console log code missing from the compiled kernel")
          print("PASS: A733 microSD console log code found in compiled XNU Mach-O")
          if b"a733fb_console" not in kernel:
              raise SystemExit("FAIL: A733 console/graphics overlay was SKIPPED")
          print("PASS: A733 console/graphics overlay found in compiled XNU Mach-O")
          if b"A733 TOUCH: polling touches" not in kernel:
              raise SystemExit("FAIL: A733 USB touch screen overlay was SKIPPED")
          print("PASS: A733 USB touch screen driver found in compiled XNU Mach-O")
          for m in (b"A733 POWER: power button ready", b"A733 POWER: halt/restart -> PSCI SYSTEM_OFF/SYSTEM_RESET",
                    b"Cortex-A55"):
              if m not in kernel:
                  raise SystemExit(f"FAIL: A733 cores/fb/power overlay was SKIPPED (missing {m!r})")
          print("PASS: A733 A55 / power button / PSCI power-off code found in compiled XNU Mach-O")
          for m in (b"A733 CPUFREQ: efuse 0x%08x -> vf%04x", b"A733 THERMAL: THS on",
                    b"A733 FIRSTBOOT: %u files written", b"A733 POWER: triple press: clean shutdown"):
              if m not in kernel:
                  raise SystemExit(f"FAIL: A733 cpufreq/setup overlay was SKIPPED (missing {m!r})")
          print("PASS: A733 cpufreq, thermal, triple press and first-boot code found in compiled XNU Mach-O")
          if b"SWEET AKS: AppleKeyStore registered (no passcode, unlocked, key wrap v1)" not in kernel:
              raise SystemExit("FAIL: A733 keychain (AKS wrap) overlay was SKIPPED")
          print("PASS: A733 AppleKeyStore key wrap found in compiled XNU Mach-O")
          if b"A733 IOKIT: %u s after boot" not in kernel:
              raise SystemExit("FAIL: A733 IOKit busy report overlay was SKIPPED")
          print("PASS: A733 IOKit busy report found in compiled XNU Mach-O")
          if b"a733bigpref" not in kernel:
              raise SystemExit("FAIL: A733 scheduler big-core preference overlay was SKIPPED")
          print("PASS: A733 scheduler big-core preference found in compiled XNU Mach-O")
          if b"a733iokitd" not in kernel:
              raise SystemExit("FAIL: A733 no-kernelmanagerd overlay was SKIPPED")
          print("PASS: A733 no-kernelmanagerd overlay found in compiled XNU Mach-O")
          PY

      - name: Build static PID1 and HFSX root (native macOS, no Linux mount)
        run: |
          mkdir -p a733/build
          xcrun clang -target arm64-apple-ios16.0 -x assembler-with-cpp -c \
            a733/src/a733-init-v19.S -o a733/build/a733-init.o
          python3 tools/mkinit.py a733/build/a733-init.o a733/build/a733-init.macho
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data = Path("a733/build/a733-init.macho").read_bytes()
          magic, cputype, _, kind, ncmds, _, _, _ = struct.unpack_from("<8I", data)
          assert (magic, cputype, kind) == (0xfeedfacf, 0x0100000c, 2)
          p = 32
          cmds = []
          for _ in range(ncmds):
              cmd, size = struct.unpack_from("<2I", data, p)
              assert size >= 8
              cmds.append(cmd)
              p += size
          assert 0x5 in cmds and 0x1d in cmds, "missing UNIXTHREAD or signature"
          assert 0xe not in cmds and 0xc not in cmds, "static PID1 cannot require dyld"
          assert struct.pack("<I", 0xd2800290) in data, "getpid(20) must precede open(5)"
          assert struct.pack("<I", 0xd4001001) in data, "missing userspace SVC #0x80"
          assert b"/sbin/launchd" in data, "v15: missing HFS+ regular-file probe"
          assert b"/dev/console" in data, "v15: missing devfs console probe"
          assert b"/a733-v18-definitely-missing" in data, "v18 missing ENOENT probe"
          assert b"A733 V18 PASS: read(4B Mach-O) + close + ENOENT" in data, "missing v18 PASS marker"
          assert b"A733 V18 FAIL: read(4B)" in data, "missing read-failure marker"
          assert b"A733 V18 FAIL: expected ENOENT" in data, "missing ENOENT-failure marker"
          assert struct.pack("<I", 0xd2800070) in data, "missing SYS_read=3 instruction"
          assert struct.pack("<I", 0xd28000d0) in data, "missing SYS_close=6 instruction"
          assert b"A733 V19 PASS: mmap RW + mprotect RO + munmap" in data, "missing v19 VM PASS marker"
          for marker in (b"A733 V19 FAIL: mmap", b"A733 V19 FAIL: VM write/read", b"A733 V19 FAIL: mprotect", b"A733 V19 FAIL: munmap"):
              assert marker in data, f"missing failure marker: {marker!r}"
          assert struct.pack("<I", 0xd28018b0) in data, "missing SYS_mmap=197"
          assert struct.pack("<I", 0xd2800950) in data, "missing SYS_mprotect=74"
          assert struct.pack("<I", 0xd2800930) in data, "missing SYS_munmap=73"
          print("PASS: static signed ARM64 Mach-O with v19 mmap/mprotect/munmap and previous v18 probes")
          PY
          bash a733/tools/make_pid1_ramdisk_macos.sh \
            a733/build/a733-init.macho a733/build/a733-pid1-root.hfs A733PID1

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: a733-pid1-root-macos
          path: |
            a733/build/a733-init.macho
            a733/build/a733-pid1-root.hfs
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  package-a733:
    name: Package audited A733 payload (no flashing)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: kernel
      - name: Install AArch64 Stage0 toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu u-boot-tools hfsprogs dosfstools mtools
      - name: Compile and test A733 Stage0
        run: make -C a733 test adt all test-boot
      - name: Check opt-in A733 iOS display device tree and rotation
        run: python3 -m unittest discover -s a733/tests -p test_ios_display.py -v

      - name: Audit, pack and validate real XNU payload
        run: |
          test -s kernel/kernel.development.sweet
          python3 a733/tools/package_xnu_a733.py kernel/kernel.development.sweet a733/build/a733-early.adt a733/build/a733-xnu.payload
          cc -std=c11 -O2 -Wall -Wextra -Werror -DA733_HOST_TEST -I a733/src a733/src/xnu_payload.c a733/tests/test_real_xnu_payload.c -o a733/build/test_real_xnu_payload
          a733/build/test_real_xnu_payload a733/build/a733-xnu.payload
          mkimage -A arm64 -O linux -T script -C none -n "a733-xnu-one-shot" -d a733/tools/sd-boot-xnu-experimental.cmd a733/build/a733-xnu-one-shot.scr
          mkimage -l a733/build/a733-xnu-one-shot.scr
          sha256sum a733/build/stage0.uimg a733/build/a733-xnu.payload a733/build/a733-xnu-one-shot.scr
      - name: RAMDisk md0 integration (mount-only diagnostic)
        run: |
          python3 -m unittest discover -s a733/tests -p test_ramdisk_pack.py -v
          bash a733/tools/make_test_ramdisk.sh a733/build/a733-test-root.hfs
          python3 a733/tools/package_xnu_a733.py \
            kernel/kernel.development.sweet a733/build/a733-early.adt \
            a733/build/a733-xnu-ramroot.payload --ramdisk a733/build/a733-test-root.hfs
          a733/build/test_real_xnu_payload a733/build/a733-xnu-ramroot.payload
          python3 - <<'PY'
          import struct, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import adt
          p = Path('a733/build/a733-xnu-ramroot.payload').read_bytes()
          assert p[:8] == b'A733XNU1'
          _, n = struct.unpack_from('<II', p, 8)
          off, size = struct.unpack_from('<2Q', p, 0x20)
          dt, _ = adt.parse(p[off:off + size])
          chosen = next(c for c in dt.children if c.name == 'chosen')
          mmap = next(c for c in chosen.children if c.name == 'memory-map')
          pa, length = struct.unpack('<2Q', mmap.prop('RAMDisk'))
          assert length == 8 * 1024 * 1024
          virtbase, = struct.unpack_from('<Q', p, 0x10)
          physbase, = struct.unpack_from('<Q', p, 0x38)
          assert any((physbase + vmaddr - virtbase == pa and vmsize == length)
                     for vmaddr, vmsize, _, _ in
                     (struct.unpack_from('<4Q', p, 0x2a8 + i * 32) for i in range(n)))
          print(f'PASS RAMDisk ADT + payload segment: PA=0x{pa:x}, size={length}')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: a733-pid1-root-macos
          path: a733/build

      - name: Validate and pack macOS-prepared PID1 HFSX md0
        run: |
          test -s a733/build/a733-init.macho
          test "$(stat -c %s a733/build/a733-pid1-root.hfs)" = 8388608
          python3 a733/tools/package_xnu_a733.py \
            kernel/kernel.development.sweet a733/build/a733-early.adt \
            a733/build/a733-xnu-pid1.payload --ramdisk a733/build/a733-pid1-root.hfs
          a733/build/test_real_xnu_payload a733/build/a733-xnu-pid1.payload
          sha256sum a733/build/a733-init.macho a733/build/a733-pid1-root.hfs \
            a733/build/a733-xnu-pid1.payload

      # Separate opt-in display candidate: normal v19 PID1 artifact stays unchanged.
      # No iOS userland is included; the framebuffer class cannot produce an
      # iOS frame until Apple's real backboardd / CoreAnimation are running.
      - name: Build opt-in AppleCLCD / IOSurface A733 payload
        run: |
          python3 a733/tools/mkadt_a733.py             a733/build/a733-ios-display.adt --ios-display
          python3 a733/tools/package_xnu_a733.py             kernel/kernel.development.sweet a733/build/a733-ios-display.adt             a733/build/a733-xnu-ios-display.payload             --ramdisk a733/build/a733-pid1-root.hfs
          a733/build/test_real_xnu_payload a733/build/a733-xnu-ios-display.payload
          python3 - <<'PY'
          import sys, struct
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import adt
          p = Path('a733/build/a733-xnu-ios-display.payload').read_bytes()
          off, size = struct.unpack_from('<2Q', p, 0x20)
          tree, _ = adt.parse(p[off:off + size])
          armio = next(n for n in tree.children if n.name == 'arm-io')
          disp = next(n for n in armio.children if n.name == 'disp0')
          assert disp.prop('device_type') == b'display-subsystem\0'
          assert disp.prop('compatible') == b'sweet,display\0'
          assert struct.unpack('<I', disp.prop('canvas-width')) == (1125,)
          assert struct.unpack('<I', disp.prop('canvas-height')) == (2436,)
          print('PASS opt-in REAL AppleCLCD display node: iPhone X 1125x2436')
          PY

      # Root on the microSD card (read-only PIO driver): no RAM disk, so the
      # payload stays small and kernel updates never rewrite the iOS partition.
      - name: Build experimental microSD-root (rd=sdroot0) payload
        run: |
          python3 a733/tools/mkadt_a733.py a733/build/a733-sdroot.adt --ios-display --sdmmc --a76-pair --usb-touch \
            --a55 --power --activation
          python3 a733/tools/package_xnu_a733.py kernel/kernel.development.sweet \
            a733/build/a733-sdroot.adt a733/build/a733-xnu-sdroot.payload --sdroot --sdrw
          python3 a733/tools/package_xnu_a733.py kernel/kernel.development.sweet \
            a733/build/a733-sdroot.adt a733/build/a733-xnu-sdroot-2cpu.payload --sdroot --sdrw --cpus 2
          a733/build/test_real_xnu_payload a733/build/a733-xnu-sdroot.payload
          a733/build/test_real_xnu_payload a733/build/a733-xnu-sdroot-2cpu.payload
          python3 - <<'PY'
          import sys, struct
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import adt
          p = Path('a733/build/a733-xnu-sdroot.payload').read_bytes()
          assert p[:8] == b'A733XNU1'
          off, size = struct.unpack_from('<2Q', p, 0x20)
          tree, _ = adt.parse(p[off:off + size])
          sd = next(n for n in tree.children if n.name == 'a733-sdmmc')
          assert struct.unpack('<2Q', sd.prop('reg')) == (0x04020000, 0x1000)
          assert struct.unpack('<2Q', sd.prop('ccu-reg')) == (0x02002000, 0x2000)
          usb = next(n for n in tree.children if n.name == 'a733-usb')
          assert next(n for n in tree.children if n.name == 'a733-power')
          assert len(next(n for n in tree.children if n.name == 'cpus').children) == 8
          assert struct.unpack('<2Q', usb.prop('dma-reg')) == (0x60000000, 0x10000)
          chosen = next(n for n in tree.children if n.name == 'chosen')
          mmap = next(n for n in chosen.children if n.name == 'memory-map')
          assert mmap.prop('RAMDisk') is None, 'sdroot payload must not carry a RAM disk'
          assert b'rd=sdroot0' in p and b'cpus=1' in p and b'sdrw=1 rootrw=1 launchd_unsecure_cache=1' in p
          print(f'PASS microSD-root payload: {len(p)} bytes, /a733-sdmmc node, no RAM disk')
          q = Path('a733/build/a733-xnu-sdroot-2cpu.payload').read_bytes()
          assert b' cpus=2 ' in q and b' cpus=1 ' not in q
          cpus = next(n for n in tree.children if n.name == 'cpus').children
          assert [struct.unpack('<I', c.prop('reg'))[0] for c in cpus][:2] == [0x600, 0x700]
          print('PASS two-A76 payload: cpus=2, ADT cpus 0x600 + 0x700')
          PY

